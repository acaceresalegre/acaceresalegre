<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F4EF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cuentas Casa">
  <title>Cuentas Casa</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Secciones">
      <div class="brand">Cuentas Casa</div>
      <button class="primary side-add" data-act="add">+ Agregar</button>
      <nav class="side-nav">
        <button class="side-tab" data-tab="inicio">Resumen</button>
        <button class="side-tab" data-tab="movimientos">Movimientos</button>
        <button class="side-tab" data-tab="vencimientos">Vencimientos<span class="badge" id="badge-side" hidden></span></button>
        <button class="side-tab" data-tab="presupuesto">Presupuesto</button>
        <button class="side-tab" data-tab="deudas">Deudas</button>
      </nav>
      <div class="side-foot">
        <button class="side-tab" data-act="scan">Escanear ticket</button>
        <button class="side-tab" data-act="settings">Ajustes</button>
        <div class="side-sync" id="side-sync"></div>
      </div>
    </aside>
    <main id="screen" class="screen"></main>
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="inicio">Inicio</button>
      <button class="tab" data-tab="vencimientos">Vencimientos<span class="badge" id="badge" hidden></span></button>
      <button class="plus" data-act="add" aria-label="Agregar">+</button>
      <button class="tab" data-tab="presupuesto">Presupuesto</button>
      <button class="tab" data-tab="deudas">Deudas</button>
    </nav>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
  <div class="toast" id="toast" role="status"></div>
  <button class="notif" id="notif" type="button"></button>
  <div class="viz-tip" id="viz-tip" role="tooltip" hidden></div>

  <script src="lib.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
